server:
  port: ${SERVER_PORT:8006}
  shutdown: graceful

spring:
  application:
    name: flight-service

http:
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
  read-timeout: ${HTTP_READ_TIMEOUT:10s}

logging:
  level:
    root: INFO
    com.aiorchestration: DEBUG
    org.springframework.ai: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
