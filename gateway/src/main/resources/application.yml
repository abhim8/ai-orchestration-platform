server:
  port: ${SERVER_PORT:8005}
  shutdown: graceful

ai:
  planner:
    enabled: ${AI_PLANNER_ENABLED:true}

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
flight-service:
  base-url: ${FLIGHT_SERVICE_BASE_URL:http://localhost:8006}

weather-service:
  base-url: ${WEATHER_SERVICE_BASE_URL:http://localhost:8007}

http:
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:10s}
  read-timeout: ${HTTP_READ_TIMEOUT:15s}

execution:
  pool:
    core-size: ${EXECUTION_POOL_CORE_SIZE:4}
    max-size: ${EXECUTION_POOL_MAX_SIZE:8}
    queue-capacity: ${EXECUTION_POOL_QUEUE_CAPACITY:50}

chat:
  memory:
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:30}
    ttl-minutes: ${CHAT_MEMORY_TTL_MINUTES:30}
    cleanup-interval-ms: ${CHAT_MEMORY_CLEANUP_INTEVAL:300000}

planning:
  clarification-threshold: ${PLANNING_CLARIFICATION_THRESHOLD:0.5}
  minimum-confidence: ${PLANNING_MINIMUM_CONFIDENCE:0.5}

logging:
  level:
    root: INFO
    com.aiorchestration: DEBUG
    org.springframework.ai: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
