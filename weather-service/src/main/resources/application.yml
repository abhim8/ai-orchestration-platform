server:
  port: ${SERVER_PORT:8007}

spring:
  application:
    name: weather-service

http:
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:10s}
  read-timeout: ${HTTP_READ_TIMEOUT:15s}

weather:
  forecast:
    max-days-ahead: ${WEATHER_MAX_DAYS_AHEAD:16}

open-meteo:
  geocoding-url: ${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
  forecast-url: ${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}

logging:
  level:
    root: INFO
    com.aiorchestration: DEBUG
    org.springframework.ai: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
